<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>杭州大会展中心假日酒店</title>
<style>
  :root{
    --bg:#f2f3f5; --card:#fff; --line:#e8e9eb;
    --text:#1a1a1a; --sub:#8a8f99; --pri:#2b6cf6; --danger:#e5484d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  /* Logo 的样式 */
  .header-left{display:flex;align-items:center;gap:8px;overflow:hidden;}
  .header-left img{height:26px;width:auto;border-radius:4px;object-fit:contain;flex:none;}
  header h1{font-size:16px;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  
  .btn-ghost{border:none;background:#f0f2f5;color:var(--text);font-size:14px;padding:7px 12px;border-radius:8px;font-family:inherit;white-space:nowrap;flex:none;}
  .btn-ghost:active{opacity:.7}

  .card{background:var(--card);border-radius:14px;margin:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .card.form{padding:0 16px}
  .card.list{padding:0;overflow:hidden}

  .field{padding:12px 0;border-bottom:1px solid var(--line)}
  .field:last-child{border-bottom:none}
  .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
  .field input[type=text],.field input[type=tel]{
    width:100%;border:none;outline:none;font-size:17px;background:transparent;
    padding:4px 0;font-family:inherit;color:var(--text);
  }
  .field input::placeholder{color:#c2c6cc}

  .photo-empty{display:flex;gap:10px}
  .photo-empty button{
    flex:1;padding:16px 8px;border:1px dashed #c9cdd4;border-radius:10px;
    background:#fafbfc;color:var(--pri);font-size:15px;font-family:inherit;
  }
  .photo-empty button:active{background:#eef4ff}
  .preview{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3}
  .preview img{width:100%;height:100%;object-fit:contain;display:block}
  .preview .remove{
    position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;
    border:none;background:rgba(0,0,0,.55);color:#fff;font-size:20px;line-height:1;
  }

  .btn-primary{
    display:block;width:calc(100% - 24px);margin:16px 12px;padding:15px;
    border:none;border-radius:12px;background:var(--pri);color:#fff;
    font-size:17px;font-weight:600;font-family:inherit;
  }
  .btn-primary:active{opacity:.85}
  .btn-primary:disabled{opacity:.6}

  .search{padding:0 12px;margin-top:16px}
  .search input{
    width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);
    background:#fff;font-size:15px;outline:none;font-family:inherit;
    -webkit-appearance:none;
  }
  .count{font-size:12px;color:var(--sub);padding:8px 16px 0}

  .rec{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
  .rec:last-child{border-bottom:none}
  .rec .thumb{width:68px;height:52px;border-radius:8px;object-fit:cover;background:#eee;flex:none}
  .rec .no-photo{
    display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#b0b4bb;background:#f4f5f7;
  }
  .rec .info{flex:1;min-width:0}
  .rec .plate{
    display:inline-block;background:#eef4ff;color:var(--pri);font-weight:600;
    font-size:14px;padding:1px 8px;border-radius:6px;letter-spacing:.5px;
  }
  .rec .name{font-size:15px;margin-top:4px}
  .rec .meta{
    font-size:12px;color:var(--sub);margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .rec .meta a{color:var(--pri);text-decoration:none}
  .rec .del{
    border:none;background:transparent;color:var(--danger);
    font-size:13px;padding:10px;font-family:inherit;flex:none;
  }
  .empty{text-align:center;color:var(--sub);font-size:14px;padding:44px 20px}

  .modal{
    position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;
  }
  .modal[hidden]{display:none}
  .modal img{max-width:100%;max-height:75vh;object-fit:contain;border-radius:8px}
  .modal button{
    margin-top:22px;padding:10px 30px;border-radius:20px;
    border:1px solid rgba(255,255,255,.4);background:transparent;
    color:#fff;font-size:15px;font-family:inherit;
  }

  .toast{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
    background:rgba(0,0,0,.82);color:#fff;padding:12px 20px;border-radius:10px;
    font-size:14px;opacity:0;transition:.2s;z-index:200;pointer-events:none;
    max-width:80%;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <!-- 这里引用了你的 Logo 图片，请确保图片名字是 logo.png -->
    <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
    <h1>杭州大会展中心假日酒店</h1>
  </div>
  <button class="btn-ghost" id="btnExport" type="button">导出 CSV</button>
</header>

<form id="form" class="card form" novalidate>
  <div class="field">
    <label for="name">车主姓名</label>
    <input id="name" type="text" placeholder="请输入姓名" autocomplete="off" maxlength="20">
  </div>
  <div class="field">
    <label for="phone">联系电话</label>
    <input id="phone" type="tel" inputmode="tel" placeholder="请输入手机号" autocomplete="off" maxlength="15">
  </div>
  <div class="field">
    <label for="plate">车牌号</label>
    <input id="plate" type="text" placeholder="如：粤A12345" autocapitalize="characters" autocomplete="off" maxlength="8">
  </div>
  <div class="field">
    <label>车辆照片</label>
    <input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
    <input type="file" id="fileAlbum" accept="image/*" hidden>
    <div class="photo-empty" id="photoEmpty">
      <button type="button" id="btnCamera">📷 拍照</button>
      <button type="button" id="btnAlbum">🖼 相册选择</button>
    </div>
    <div class="preview" id="photoPreview" hidden>
      <img id="previewImg" alt="车辆照片预览">
      <button type="button" class="remove" id="btnRemovePhoto" aria-label="移除照片">×</button>
    </div>
  </div>
</form>

<button class="btn-primary" id="btnSave" type="submit" form="form">保存登记</button>

<div class="search">
  <input id="search" type="search" placeholder="搜索姓名 / 电话 / 车牌" autocomplete="off">
</div>
<div class="count" id="count"></div>
<div class="card list"><div id="list"></div></div>

<div class="modal" id="modal" hidden>
  <img id="modalImg" alt="车辆照片">
  <button type="button" id="modalClose">关闭</button>
</div>

<script>
(function(){
'use strict';

const DB_NAME='hotel_vehicle_db', STORE='records';

let db=null;
let records=[];           // 按时间倒序
let thumbURLs=[];         // 待回收的缩略图 URL
let currentPhoto=null;    // 待保存的照片 Blob
let currentPhotoURL=null;

const $=s=>document.querySelector(s);
const nameEl=$('#name'), phoneEl=$('#phone'), plateEl=$('#plate');
const photoEmpty=$('#photoEmpty'), photoPreview=$('#photoPreview'), previewImg=$('#previewImg');
const listEl=$('#list'), countEl=$('#count'), searchEl=$('#search');
const modal=$('#modal'), modalImg=$('#modalImg');
const btnSave=$('#btnSave');

/* ---------------- IndexedDB ---------------- */
function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=()=>{
      const d=req.result;
      if(!d.objectStoreNames.contains(STORE)){
        d.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});
      }
    };
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}
const store=mode=>db.transaction(STORE,mode).objectStore(STORE);
const dbAdd=rec=>new Promise((res,rej)=>{const r=store('readwrite').add(rec);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const dbAll=()=>new Promise((res,rej)=>{const r=store('readonly').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});
const dbDel=id=>new Promise((res,rej)=>{const r=store('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});

/* ---------------- 工具 ---------------- */
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtTime(ts){
  const d=new Date(ts), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function dateStamp(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}
let toastTimer=null;
function toast(msg){
  let el=document.querySelector('.toast');
  if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el);}
  el.textContent=msg;
  requestAnimationFrame(()=>el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}

/* ---------------- 图片压缩 ---------------- */
function compressImage(file,maxSize,quality){
  maxSize=maxSize||1280; quality=quality||0.75;
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      try{
        let w=img.naturalWidth, h=img.naturalHeight;
        const scale=Math.min(1, maxSize/Math.max(w,h));
        w=Math.max(1,Math.round(w*scale));
        h=Math.max(1,Math.round(h*scale));
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#fff';
        ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        canvas.toBlob(b=>{
          URL.revokeObjectURL(url);
          b?resolve(b):reject(new Error('照片处理失败'));
        },'image/jpeg',quality);
      }catch(e){
        URL.revokeObjectURL(url);
        reject(e);
      }
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('无法读取该图片'));};
    img.src=url;
  });
}

/* ---------------- 照片选择 ---------------- */
async function onFileChange(e){
  const file=e.target.files && e.target.files[0];
  e.target.value='';   // 允许重复选择同一张
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('请选择图片文件'); return; }
  toast('正在处理照片…');
  try{
    const blob=await compressImage(file);
    if(currentPhotoURL) URL.revokeObjectURL(currentPhotoURL);
    currentPhoto=blob;
    currentPhotoURL=URL.createObjectURL(blob);
    previewImg.src=currentPhotoURL;
    photoEmpty.hidden=true;
    photoPreview.hidden=false;
  }catch(err){
    toast('照片处理失败：'+err.message);
  }
}
function clearPhoto(){
  currentPhoto=null;
  if(currentPhotoURL){URL.revokeObjectURL(currentPhotoURL);currentPhotoURL=null;}
  previewImg.removeAttribute('src');
  photoPreview.hidden=true;
  photoEmpty.hidden=false;
}

/* ---------------- 保存 ---------------- */
async function save(){
  const name=nameEl.value.trim();
  const phone=phoneEl.value.replace(/[\s-]/g,'');
  const plate=plateEl.value.trim().toUpperCase();

  if(!name) return toast('请填写车主姓名');
  if(!/^\d{7,15}$/.test(phone)) return toast('请填写正确的联系电话');
  if(!plate) return toast('请填写车牌号');
  if(!/^[\u4e00-\u9fa5][A-Z][A-Z0-9]{4,6}[\u4e00-\u9fa5]?$/.test(plate)){
    if(!confirm('车牌号「'+plate+'」格式不太常见，仍要保存吗？')) return;
  }
  if(!currentPhoto) return toast('请拍摄或选择车辆照片');

  btnSave.disabled=true; btnSave.textContent='保存中…';
  try{
    const rec={name,phone,plate,photo:currentPhoto,createdAt:Date.now()};
    rec.id=await dbAdd(rec);
    records.unshift(rec);
    resetForm();
    renderList();
    toast('登记成功');
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(err){
    console.error(err);
    toast('保存失败：'+err.message);
  }finally{
    btnSave.disabled=false; btnSave.textContent='保存登记';
  }
}
function resetForm(){
  nameEl.value=''; phoneEl.value=''; plateEl.value='';
  clearPhoto();
}

/* ---------------- 列表 ---------------- */
function renderList(){
  const kw=searchEl.value.trim().toLowerCase();
  thumbURLs.forEach(u=>URL.revokeObjectURL(u));
  thumbURLs=[];

  const list=records.filter(r=>
    !kw ||
    r.name.toLowerCase().includes(kw) ||
    r.phone.includes(kw) ||
    r.plate.toLowerCase().includes(kw)
  );

  countEl.textContent = `共 ${list.length} 条记录` + (records.length!==list.length ? `（全部 ${records.length} 条）` : '');
  listEl.innerHTML='';

  if(!list.length){
    listEl.innerHTML='<div class="empty">'+(records.length?'没有匹配的记录':'暂无登记记录')+'</div>';
    return;
  }

  const frag=document.createDocumentFragment();
  list.forEach(r=>{
    const row=document.createElement('div');
    row.className='rec';

    let thumbHTML='<div class="thumb no-photo">无照片</div>';
    let thumbUrl=null;
    if(r.photo){
      thumbUrl=URL.createObjectURL(r.photo);
      thumbURLs.push(thumbUrl);
      thumbHTML='<img class="thumb" src="'+thumbUrl+'" alt="车辆照片">';
    }

    const tel=esc(r.phone.replace(/[^\d+]/g,''));

    row.innerHTML =
      thumbHTML +
      '<div class="info">' +
        '<span class="plate">'+esc(r.plate)+'</span>' +
        '<div class="name">'+esc(r.name)+'</div>' +
        '<div class="meta"><a href="tel:'+tel+'">'+esc(r.phone)+'</a> · '+fmtTime(r.createdAt)+'</div>' +
      '</div>' +
      '<button class="del" type="button">删除</button>';

    const thumb=row.querySelector('.thumb');
    if(thumbUrl && thumb){
      thumb.addEventListener('click',()=>showPhoto(r.photo));
    }
    row.querySelector('.del').addEventListener('click',()=>removeRecord(r.id,r.plate));
    frag.appendChild(row);
  });
  listEl.appendChild(frag);
}

async function removeRecord(id,plate){
  if(!confirm('确定删除车牌「'+plate+'」的登记记录吗？')) return;
  try{
    await dbDel(id);
    records=records.filter(r=>r.id!==id);
    renderList();
    toast('已删除');
  }catch(err){
    toast('删除失败：'+err.message);
  }
}

/* ---------------- 大图 ---------------- */
function showPhoto(blob){
  modalImg.src=URL.createObjectURL(blob);
  modal.hidden=false;
}
function hideModal(){
  modal.hidden=true;
  if(modalImg.src && modalImg.src.startsWith('blob:')) URL.revokeObjectURL(modalImg.src);
  modalImg.removeAttribute('src');
}

/* ---------------- 导出 ---------------- */
function downloadBlob(blob,filename){
  const a=document.createElement('a');
  const url=URL.createObjectURL(blob);
  a.href=url; a.download=filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
}
function exportCSV(){
  if(!records.length) return toast('暂无数据可导出');
  const rows=[['车主姓名','联系电话','车牌号','登记时间']];
  records.forEach(r=>rows.push([r.name,r.phone,r.plate,fmtTime(r.createdAt)]));
  const csv='\ufeff'+rows.map(row=>
    row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')
  ).join('\r\n');
  downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),'车辆登记_'+dateStamp()+'.csv');
  toast('已导出 CSV');
}

/* ---------------- 事件绑定 ---------------- */
function bindEvents(){
  $('#form').addEventListener('submit',e=>{e.preventDefault();save();});
  $('#btnCamera').addEventListener('click',()=>$('#fileCamera').click());
  $('#btnAlbum').addEventListener('click',()=>$('#fileAlbum').click());
  $('#fileCamera').addEventListener('change',onFileChange);
  $('#fileAlbum').addEventListener('change',onFileChange);
  $('#btnRemovePhoto').addEventListener('click',clearPhoto);

  plateEl.addEventListener('input',()=>{
    const v=plateEl.value;
    if(/[a-z]/.test(v)) plateEl.value=v.toUpperCase();   // 只在小写时才改，避免光标跳动
  });

  searchEl.addEventListener('input',renderList);
  $('#btnExport').addEventListener('click',exportCSV);
  $('#modalClose').addEventListener('click',hideModal);
  modal.addEventListener('click',e=>{if(e.target===modal) hideModal();});
}

/* ---------------- 启动 ---------------- */
async function init(){
  try{
    db=await openDB();
  }catch(err){
    console.error(err);
    alert('本地数据库无法使用。\n请通过 http/https 访问本页面（不要直接双击打开文件）。');
    return;
  }
  records=(await dbAll()).sort((a,b)=>b.createdAt-a.createdAt);
  bindEvents();
  renderList();
}
init();

})();
</script>
</body>
</html>
